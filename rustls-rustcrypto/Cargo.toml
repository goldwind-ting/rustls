[package]
name = "rustls-rustcrypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A no_std crypto provider for rustls built on RustCrypto primitives: TLS 1.3 only, post-quantum X25519MLKEM768, ECDSA and Ed25519 certificates, application-installed randomness"
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
hmac = { version = "0.13", features = ["zeroize"] }
ml-kem = { version = "0.3.3", features = ["zeroize"] }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["alloc", "ecdh", "ecdsa", "pkcs8"] }
rustls = { path = "../rustls", version = "0.24.0-dev.3", default-features = false, features = ["webpki"] }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3", features = ["static_secrets"] }
